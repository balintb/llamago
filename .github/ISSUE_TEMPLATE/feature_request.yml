name: Feature request
description: Something llamago should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What is missing
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What you would use it for
      description: The situation it comes up in is worth more than the shape of the feature, and often suggests a smaller one.
    validations:
      required: true
